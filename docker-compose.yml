
services:
  db:
    image: citusdata/citus:12.1
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-elimuhub}
      - POSTGRES_USER=${DB_USER:-elimuhub_admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-***REDACTED***}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-elimuhub_admin} -d ${DB_NAME:-elimuhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  citus-worker:
    image: citusdata/citus:12.1
    container_name: elimuhub-citus-worker
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME:-elimuhub}
      - POSTGRES_USER=${DB_USER:-elimuhub_admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-***REDACTED***}
    depends_on:
      db:
        condition: service_healthy

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: elimuhub-pgbouncer
    ports:
      - "6432:6432"
    volumes:
      - ./nginx/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./nginx/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6432"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    user: root
    command: >
      bash -c "python manage.py migrate_schemas --shared --noinput &&
               python manage.py migrate_schemas --tenant --noinput &&
               python manage.py create_public_tenant &&
               python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-123}
      - DATABASE_URL=postgres://${DB_USER:-elimuhub_admin}:${DB_PASSWORD:-***REDACTED***}@pgbouncer:6432/${DB_NAME:-elimuhub}
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_NAME=${DB_NAME:-elimuhub}
      - DB_USER=${DB_USER:-elimuhub_admin}
      - DB_PASSWORD=${DB_PASSWORD:-***REDACTED***}
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost
      - ALLOWED_HOSTS=localhost,.localhost,127.0.0.1
      - OTEL_ENABLED=True
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  celery:
    build: ./backend
    user: root
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-123}
      - DATABASE_URL=postgres://${DB_USER:-elimuhub_admin}:${DB_PASSWORD:-***REDACTED***}@pgbouncer:6432/${DB_NAME:-elimuhub}
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_NAME=${DB_NAME:-elimuhub}
      - DB_USER=${DB_USER:-elimuhub_admin}
      - DB_PASSWORD=${DB_PASSWORD:-***REDACTED***}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,.localhost,127.0.0.1
      - OTEL_ENABLED=True
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  celery-beat:
    build: ./backend
    user: root
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-123}
      - DATABASE_URL=postgres://${DB_USER:-elimuhub_admin}:${DB_PASSWORD:-***REDACTED***}@pgbouncer:6432/${DB_NAME:-elimuhub}
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_NAME=${DB_NAME:-elimuhub}
      - DB_USER=${DB_USER:-elimuhub_admin}
      - DB_PASSWORD=${DB_PASSWORD:-***REDACTED***}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,.localhost,127.0.0.1
      - OTEL_ENABLED=True
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: elimuhub-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./nginx/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  kafka:
    image: apache/kafka:latest
    container_name: elimuhub-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  prometheus:
    image: prom/prometheus:latest
    container_name: elimuhub-prometheus
    volumes:
      - ./nginx/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: elimuhub-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
