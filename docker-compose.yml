
services:
  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=elimuhub
      - POSTGRES_USER=elimuhub_admin
      - POSTGRES_PASSWORD=***REDACTED***
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elimuhub_admin -d elimuhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    user: root
    command: >
      bash -c "python manage.py migrate_schemas --shared --noinput &&
               python manage.py migrate_schemas --tenant --noinput &&
               python manage.py create_public_tenant &&
               python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-123
      - DATABASE_URL=postgres://elimuhub_admin:***REDACTED***@db:5432/elimuhub
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=elimuhub
      - DB_USER=elimuhub_admin
      - DB_PASSWORD=***REDACTED***
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost
      - ALLOWED_HOSTS=localhost,.localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  celery:
    build: ./backend
    user: root
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-123
      - DATABASE_URL=postgres://elimuhub_admin:***REDACTED***@db:5432/elimuhub
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=elimuhub
      - DB_USER=elimuhub_admin
      - DB_PASSWORD=***REDACTED***
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,.localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: ./backend
    user: root
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-123
      - DATABASE_URL=postgres://elimuhub_admin:***REDACTED***@db:5432/elimuhub
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=elimuhub
      - DB_USER=elimuhub_admin
      - DB_PASSWORD=***REDACTED***
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,.localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
