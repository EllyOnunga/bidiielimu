[databases]
* = host=db port=5432 auth_user=gilanios_admin

[pgbouncer]
listen_port = 6432
listen_addr = *
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
max_client_conn = 5000
default_pool_size = 50
reserve_pool_size = 5
reserve_pool_timeout = 5
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
admin_users = gilanios_admin
