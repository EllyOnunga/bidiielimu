# ─────────────────────────────────────────────
# GilaniOS — Local Development Proxy (High Stability)
# ─────────────────────────────────────────────

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100M;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    # ── WebSocket (Django Channels) ──
    location /ws/ {
        proxy_pass          http://backend:8000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
    }

    # ── Django API ──
    location /api/ {
        proxy_pass          http://backend:8000;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        
        proxy_read_timeout  300s;
        proxy_connect_timeout 300s;
        
        # Prevent Nginx from closing connection on upstream errors
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # ── Path-based Tenant API ──
    location ~ ^/school/[^/]+/api/ {
        proxy_pass          http://backend:8000;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  300s;
    }

    # ── Django Admin ──
    location /admin/ {
        proxy_pass          http://backend:8000;
        proxy_set_header    Host $host;
    }

    # ── Static Files (Django) ──
    location /static/ {
        alias /vol/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Media Files (User Uploads) ──
    location /media/ {
        alias /vol/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Static Files (prevent fallback for assets) ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        expires off;
        add_header Cache-Control "no-cache";
        
        # If frontend returns 404, don't serve HTML
        proxy_intercept_errors on;
        error_page 404 =404 /404.html;
    }

    # ── React SPA ──
    location / {
        proxy_pass          http://frontend:80;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        
        # Disable caching for the HTML
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
