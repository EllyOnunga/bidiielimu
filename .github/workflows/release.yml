name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'         # stable:  v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'  # RC:      v1.2.3-rc.1
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+' # Beta:   v1.2.3-beta.1

permissions:
  contents: write   # needed to create GitHub Releases
  packages: write   # needed to push Docker images to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ────────────────────────────────────────────
  # 1. Validate the tag matches VERSION file
  # ────────────────────────────────────────────
  validate-version:
    name: Validate Version Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"                # e.g. v1.2.3 or v1.2.3-rc.1
          VERSION="${TAG#v}"                       # strip leading v
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          if [[ "$TAG" =~ -(rc|beta|alpha)\. ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify VERSION file matches tag
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION="${{ steps.parse.outputs.version }}"
          # Strip pre-release suffix for base comparison
          BASE_TAG=$(echo "$TAG_VERSION" | cut -d'-' -f1)
          if [ "$FILE_VERSION" != "$BASE_TAG" ]; then
            echo "❌ Tag v${TAG_VERSION} does not match VERSION file (${FILE_VERSION})"
            echo "   Run: make bump-version VERSION=${BASE_TAG} then commit before tagging."
            exit 1
          fi
          echo "✅ Version match: ${TAG_VERSION}"

  # ────────────────────────────────────────────
  # 2. Run full CI (reuses same checks as ci-cd.yml)
  # ────────────────────────────────────────────
  ci:
    name: Run CI Checks
    needs: validate-version
    uses: ./.github/workflows/ci-cd.yml

  # ────────────────────────────────────────────
  # 3. Build & Push Docker Images to GHCR
  # ────────────────────────────────────────────
  docker:
    name: Build & Push Docker Images
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/gilanios-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ needs.validate-version.outputs.prerelease == 'false' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.validate-version.outputs.version }}

  # ────────────────────────────────────────────
  # 4. Build Frontend & Upload as Release Asset
  # ────────────────────────────────────────────
  build-frontend:
    name: Build Frontend Bundle
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        run: |
          cd frontend
          npm ci
          VITE_APP_VERSION=${{ needs.validate-version.outputs.version }} npm run build

      - name: Archive frontend dist
        run: |
          tar -czf gilanios-frontend-${{ needs.validate-version.outputs.version }}.tar.gz -C frontend dist

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: gilanios-frontend-${{ needs.validate-version.outputs.version }}.tar.gz
          retention-days: 30

  # ────────────────────────────────────────────
  # 5. Create GitHub Release with changelog
  # ────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [validate-version, docker, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for changelog generation

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -2 | tail -1)

          echo "## What's Changed in v${VERSION}" > changelog.md
          echo "" >> changelog.md

          if [ -z "$PREV_TAG" ]; then
            echo "🎉 **Initial Release**" >> changelog.md
            git log --pretty=format:"- %s (%h)" >> changelog.md
          else
            echo "### 🚀 Features" >> changelog.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --grep="^feat" >> changelog.md || true
            echo "" >> changelog.md
            echo "### 🐛 Bug Fixes" >> changelog.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --grep="^fix" >> changelog.md || true
            echo "" >> changelog.md
            echo "### 🔒 Security" >> changelog.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --grep="^fix(security)" >> changelog.md || true
            echo "" >> changelog.md
            echo "### 🔧 Chores & Other Changes" >> changelog.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --grep="^chore\|^refactor\|^docs\|^style\|^test\|^ci" >> changelog.md || true
            echo "" >> changelog.md
            echo "**Full Diff:** [\`${PREV_TAG}...v${VERSION}\`](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${VERSION})" >> changelog.md
          fi

          echo "" >> changelog.md
          echo "---" >> changelog.md
          echo "### 🐳 Docker Images" >> changelog.md
          echo "\`\`\`" >> changelog.md
          echo "ghcr.io/${{ github.repository_owner }}/gilanios-backend:${VERSION}" >> changelog.md
          echo "\`\`\`" >> changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GilaniOS v${{ needs.validate-version.outputs.version }}
          body_path: changelog.md
          prerelease: ${{ needs.validate-version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.validate-version.outputs.prerelease == 'false' }}
          files: |
            gilanios-frontend-${{ needs.validate-version.outputs.version }}.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
