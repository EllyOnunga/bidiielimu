services:
  - type: web
    name: elimuhub-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --no-input"
    startCommand: "cd backend && python manage.py migrate --noinput && python manage.py create_public_tenant && gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DATABASE_URL
        fromDatabase:
          name: elimuhub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DEBUG
        value: "True"
      - key: WEB_CONCURRENCY
        value: 2

databases:
  - name: elimuhub-db
    plan: free
    region: oregon
