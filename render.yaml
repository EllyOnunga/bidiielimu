services:
  - type: web
    name: gilanios-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --no-input"
    startCommand: "cd backend && python manage.py migrate_schemas --shared --noinput && python manage.py migrate_schemas --tenant --noinput && python manage.py create_public_tenant && daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DATABASE_URL
        fromDatabase:
          name: gilanios-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: 1

databases:
  - name: gilanios-db
    plan: free
    region: oregon
